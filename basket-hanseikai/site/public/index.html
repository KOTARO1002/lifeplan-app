<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<script>try{if(localStorage.getItem('hansei.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>カンタ＆フウタ バスケ反省会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Noto+Sans+JP:wght@400;700;900&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: sports-league-app look. Black ground, charcoal tiles, condensed italic section labels,
   horizontal highlight rails per game, white pills for filters, red for the primary action. Single dark theme by choice. */
:root{ color-scheme:dark; --shade:rgba(0,0,0,.7); --ex:#f5b301; --good:#12a150; --bad:#566378;
  --bg:#000000; --surface:#131417; --sunken:#1f2126; --ink:#ffffff; --muted:#a3a7b1; --line:#2b2e36;
  --accent:#e4173d; --accent-ink:#ffffff; --accent-soft:#3a0c16;
  --q:#5b96ff; --q-soft:#0f2146; --danger:#ff6474; --ok:#2fd27a;
  --court:#c9914f; --court-key:#b0763a; --court-line:#fff6e4;
  --who1:#e4173d; --who2:#2f6bff; --who3:#c97a00; --who4:#9b4dde;
  --f-display:"Barlow Condensed","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Barlow Condensed","Noto Sans JP",ui-monospace,monospace;
  --r:10px; --tab-h:60px;
}
:root[data-theme="light"]{ color-scheme:light;
  --bg:#f3f4f7; --surface:#ffffff; --sunken:#e4e7ee; --ink:#0c1016; --muted:#566070; --line:#d3d8e2;
  --accent:#d3122f; --accent-ink:#ffffff; --accent-soft:#fde4e9;
  --q:#1d5fd6; --q-soft:#e2ecff; --danger:#c8102e; --ok:#0f8a4a;
  --court:#dba765; --court-key:#c98d49; --court-line:#fffaf0;
  --who1:#d3122f; --who2:#1d5fd6; --who3:#b86e00; --who4:#8a3fd1; --shade:rgba(20,30,50,.18) }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--q);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:1.08em}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:54px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1;gap:3px;border-left:5px solid var(--accent);padding-left:9px;transform:skewX(-8deg)}
.brand i{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.03em;white-space:nowrap}
.brand span{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.12em;white-space:nowrap}
.back{border:0;background:var(--sunken);border-radius:999px;height:38px;padding:0 14px 0 10px;font-weight:700;display:flex;align-items:center;gap:4px}
.themebtn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
.sync{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.cloud::before{background:var(--ok)}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 12px 0 6px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;max-width:46%}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900;flex:none}

main{max-width:720px;margin:0 auto;padding-block:16px calc(var(--tab-h) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;height:var(--tab-h)}
.tab{border:0;border-top:3px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}

.colA,.colB{display:contents}
@media (min-width:900px){
  .top-in,.tabs-in,main{max-width:1180px}
  main.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px 28px;align-items:start}
  main.split>.boards,main.split>.banner,main.split>.span{grid-column:1/-1}
  main.split>.colA,main.split>.colB{display:flex;flex-direction:column;gap:16px;min-width:0}
  main.split>.colA.stick,main.split>.colB.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 71px)}
  main.split .stage-wrap.pin{position:static;box-shadow:none}
  .scene-card{width:260px}.add-tile{width:160px;height:146px}
  .sheet{place-items:center}.sheet-in{border-radius:16px;border:1px solid var(--line)}
  .btn:hover:not(:disabled),.pill:hover,.step:hover{filter:brightness(1.15)}
}
.eyebrow{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.banner{background:var(--q-soft);border-left:4px solid var(--q);border-radius:6px;padding:10px 14px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--sunken);border-radius:8px;min-height:46px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:54px;font-size:16px;width:100%}
.btn.small{min-height:38px;padding:0 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.grow{flex:1;min-width:0}
.filters{display:flex;gap:8px;overflow-x:auto}
.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;min-height:38px;padding:0 18px;font-weight:700;font-size:13.5px;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.empty{background:var(--surface);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.empty h2{font-size:20px;font-weight:900;text-wrap:balance;line-height:1.4}
.empty p{color:var(--muted);max-width:34em}
.steps{display:flex;flex-direction:column;gap:6px;text-align:left;font-size:14px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline}
.steps li::before{content:counter(s);font-family:var(--f-display);font-style:italic;font-weight:800;font-size:20px;color:var(--accent);width:1em;flex:none}

.game{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.game-head{display:flex;flex-direction:column;gap:4px}
.game-head h2{font-size:19px;font-weight:900;overflow-wrap:anywhere;line-height:1.35}
.meta{color:var(--muted);font-size:12.5px}
.tag{font-size:11.5px;font-weight:900;border-radius:4px;padding:1px 8px;color:#fff}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px}
.scene-card{flex:none;width:min(66vw,250px);scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.thumb{width:100%;aspect-ratio:16/9;border-radius:var(--r);background:var(--sunken);position:relative;overflow:hidden;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.thumb .badge{position:absolute;z-index:1;right:8px;bottom:6px;color:#fff;font-weight:700;font-size:15px}
.thumb .play{position:absolute;z-index:1;left:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:12px;padding-left:2px}
.thumb .new{position:absolute;z-index:1;left:0;top:8px;background:var(--accent);color:#fff;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.08em;padding:0 10px 0 8px;border-radius:0 4px 4px 0}
.scene-card h3{font-size:14.5px;font-weight:700;overflow-wrap:anywhere;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;background:var(--sunken);color:var(--muted)}
.chip.q{background:var(--q-soft);color:var(--q)}
.chip.ok{color:var(--ok)}
/* rating marks: gold and sparkling, plain green, or grey and gloomy */
.rate{position:absolute;z-index:2;right:6px;top:6px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.05em;line-height:1.45;padding:0 9px;border-radius:4px;white-space:nowrap}
.rate.ex{background:linear-gradient(100deg,#ffe27a,#ffb300 45%,#ff8a00);color:#241800;box-shadow:0 0 14px rgba(255,190,0,.85)}
.rate.good{background:var(--good);color:#fff}
.rate.bad{background:#3e4859;color:#cfd7e3}
.thumb.r-ex{box-shadow:0 0 0 3px var(--ex),0 0 18px rgba(255,190,0,.55)}
.thumb.r-good{box-shadow:0 0 0 3px var(--good)}
.thumb.r-bad{box-shadow:0 0 0 3px var(--bad)}
.thumb.r-bad img{filter:grayscale(.9) brightness(.55) contrast(.9)}
.thumb.r-ex::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0}
.mood{border-radius:var(--r);padding:12px 16px;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:30px;line-height:1.1;letter-spacing:.04em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative;overflow:hidden}
.mood small{font-family:var(--f-body);font-style:normal;font-size:13px;font-weight:700;letter-spacing:0}
.mood.none{background:var(--surface);color:var(--muted);padding-block:10px}
.mood.ex{background:linear-gradient(105deg,#ffe27a,#ffb300 40%,#ff8a00 75%,#ffd23d);color:#241800;box-shadow:0 0 22px rgba(255,180,0,.5)}
.mood.good{background:var(--good);color:#fff}
.mood.bad{background:linear-gradient(#3c4556,#272d3a);color:#aab5c5}
.mood.bad::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(255,255,255,.13) 13px 14px)}
.stage-wrap[data-rate="ex"]{border:3px solid var(--ex)}.stage-wrap[data-rate="good"]{border:3px solid var(--good)}.stage-wrap[data-rate="bad"]{border:3px solid var(--bad)}
.seg.rates button{padding:0 4px;white-space:nowrap;font-size:12.5px}
.seg.rates button[data-m="ex"][aria-pressed="true"]{background:linear-gradient(100deg,#ffe27a,#ffb300 50%,#ff8a00);color:#241800}
.seg.rates button[data-m="good"][aria-pressed="true"]{background:var(--good);color:#fff}
.seg.rates button[data-m="bad"][aria-pressed="true"]{background:#3e4859;color:#cfd7e3}
.pill.m-ex[aria-pressed="true"]{background:linear-gradient(100deg,#ffe27a,#ffb300 50%,#ff8a00);border-color:#ffb300;color:#241800}
.pill.m-good[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pill.m-bad[aria-pressed="true"]{background:#3e4859;border-color:#3e4859;color:#cfd7e3}
.confetti{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-24px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@media (prefers-reduced-motion:no-preference){
  .thumb.r-ex::before{animation:shine 2.6s ease-in-out infinite}
  .mood.ex{animation:glow 1.6s ease-in-out infinite alternate}
  .mood.bad::after{animation:rain 1.1s linear infinite}
  @keyframes shine{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
  @keyframes glow{from{box-shadow:0 0 10px rgba(255,180,0,.35)}to{box-shadow:0 0 28px rgba(255,180,0,.8)}}
  @keyframes rain{to{background-position:-14px 52px}}
}
.chip.bad{background:var(--accent-soft);color:var(--danger)}
.upl{position:fixed;inset:0;z-index:35;background:var(--bg);display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.upl-in{width:min(100%,420px);display:flex;flex-direction:column;gap:14px;text-align:center}
.upl-title{font-size:19px;font-weight:900;line-height:1.4;text-wrap:balance}
.upl-pct{font-size:72px;font-weight:700;line-height:1;font-style:italic}
.upl-warn{background:var(--surface);border-radius:var(--r);padding:12px;font-weight:700;font-size:14px}
.upl .meter{height:12px;border-radius:6px}.upl .meter i{background:var(--accent);border-radius:6px}
.meter{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:4px}
.meter-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;color:var(--ink);font-size:14px}
.bd-tool{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 62px)}
.stack{display:flex;flex-direction:column;gap:16px}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.motion{display:flex;gap:8px;align-items:center}
.motion .btn{flex:none;min-height:42px;padding:0 14px}
.motion .btn:disabled{background:var(--sunken);border-color:var(--line);color:var(--muted);opacity:1}
.step{flex:none;min-width:44px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--sunken);font-family:var(--f-body);font-weight:700;font-size:22px;line-height:1;color:var(--muted)}
.step[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.add{padding:0 12px;background:transparent;border-style:dashed;color:var(--ink);font-family:var(--f-body);font-size:13px}
#storBody{display:flex;flex-direction:column;gap:8px}
.add-tile{flex:none;width:min(40vw,150px);aspect-ratio:auto;align-self:flex-start;border:1px dashed var(--line);background:transparent;border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13px;color:var(--ink);scroll-snap-align:start;height:calc(min(66vw,250px) * 9 / 16)}
.add-tile b{font-size:26px;line-height:1;color:var(--accent)}
.none{color:var(--muted);font-size:13.5px}

.stage-wrap{background:#000;border-radius:var(--r);overflow:hidden;display:grid;place-items:center;border:1px solid var(--line)}
.stage-wrap.pin{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:5;box-shadow:0 8px 18px var(--shade)}
.stage{position:relative;width:100%;max-width:100%;background:#000;touch-action:manipulation}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9))}
.stage svg.ov.on{pointer-events:auto;touch-action:none;cursor:crosshair}
.stage .tap{position:absolute;inset:0;border:0;background:transparent}
.panel{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.scrub{display:flex;flex-direction:column;gap:2px}
.scrub input[type=range]{width:100%;margin:0;height:40px;accent-color:var(--accent);touch-action:none}
.rangebar{height:6px;border-radius:3px;background:var(--sunken)}
.time{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.transport{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.transport .btn{padding:0;min-height:48px;font-size:13px}
.btn.play,.transport .play{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:18px}
.seg{display:inline-flex;background:var(--sunken);border-radius:8px;padding:3px;gap:2px;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;min-height:38px;padding:0 12px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.full{display:flex}.seg.full button{flex:1}
.swatches{display:flex;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea,.composer textarea{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:16px}
.field textarea,.composer textarea{resize:vertical;min-height:72px}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab .btn{flex-direction:column;gap:0;min-height:54px;line-height:1.3}
.ab .btn small{font-weight:600;color:var(--muted)}

.scene-title{font-size:21px;font-weight:900;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .bubble{background:var(--surface);border-radius:4px 12px 12px 12px;padding:8px 12px;min-width:0;max-width:100%}
.msg.q .bubble{background:var(--q-soft);box-shadow:inset 3px 0 0 var(--q)}
.msg .name{font-size:12px;font-weight:700}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .del{border:0;background:none;color:var(--muted);font-size:12px;padding:0;text-decoration:underline}
.qtag{font-size:11px;font-weight:900;color:var(--q);margin-left:6px}
.composer{display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:38px}
.check input{width:20px;height:20px;accent-color:var(--q)}

.court-wrap{border-radius:var(--r);overflow:hidden;background:var(--court);max-width:520px;width:100%;margin:0 auto}
.court-wrap svg.draw{touch-action:none}
.court-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.boards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.boards .btn{flex:none;max-width:60vw}
.boards .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boards .btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.boards .btn em{font-style:normal;font-size:11px;font-weight:700;opacity:.65;flex:none}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:grid;place-items:end center}

<body>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60);return m+':'+(t%60).toFixed(1).padStart(4,'0')};
const day=ms=>{const d=new Date(ms);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r3=n=>Math.round(n*1000)/1000;
const MAX_UP=20*1024*1024, MAX_CLIP=60;
const app=$('#app');

const S={lock:false,local:new Set(),filter:'all',view:'home',arg:null,who:null,mode:'loading',canUpload:false,videos:[],scenes:[],boards:[],loaded:{}};
const OLD={'パパ':'お父ちゃん','ママ':'お母ちゃん'},nm=n=>OLD[n]||n; /* names used by the first version */
try{const w=localStorage.getItem('hansei.who')||null;S.who=nm(w);if(w&&S.who!==w)localStorage.setItem('hansei.who',S.who)}catch(e){}
function fixNames(d){if(d.by)d.by=nm(d.by);if(d.comments){d.comments={...d.comments};for(const k in d.comments){const c=d.comments[k];if(c&&OLD[c.by])d.comments[k]={...c,by:nm(c.by)}}}return d}

/* ---------- people ---------- */
const PRESET=['カンタ','フウタ','お父ちゃん','お母ちゃん'],INITIAL={'カンタ':'カ','フウタ':'フ','お父ちゃん':'父','お母ちゃん':'母','ふたり':'2'};
const PLAYERS=['カンタ','フウタ','ふたり'];
const RATES={ex:{l:'EXCELLENT',i:'★',t:'最高のプレー！'},good:{l:'GOOD',i:'✓',t:'いいプレー'},bad:{l:'BAD',i:'☁',t:'次は直そう'}};
S.rate='all';
const rateBtns=cur=>Object.entries(RATES).map(([k,m])=>`<button data-m="${k}" aria-pressed="${cur===k}">${m.i} ${m.l}</button>`).join('');
function confetti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const box=document.createElement('div'),cols=['#ffd84a','#ff9d00','#e4173d','#2f6bff','#2fd27a','#ffffff'];box.className='confetti';
  for(let i=0;i<48;i++){const c=document.createElement('i');c.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*6}px;height:${10+Math.random()*8}px;background:${cols[i%6]};animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()*1.3}s`;box.appendChild(c)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3400)}
function whoColor(n){const i=PRESET.indexOf(n);if(i>=0)return `var(--who${i+1})`;if(n==='ふたり')return '#555b66';let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return `var(--who${(h%4)+1})`}
const dot=n=>`<span class="dot" style="background:${whoColor(n)}">${esc(INITIAL[n]||String(n||'?').slice(0,1))}</span>`;
try{const f=localStorage.getItem('hansei.filter');if(f)S.filter=f}catch(e){}
/* what this phone has already looked at, so things the others added show as NEW */
let SEEN={};try{SEEN=JSON.parse(localStorage.getItem('hansei.seen')||'{}')||{}}catch(e){}
const latest=sc=>Math.max(sc.by!==S.who?(sc.at||0):0,...Object.values(sc.comments||{}).filter(c=>c&&!c.x&&c.by!==S.who).map(c=>c.at||0));
const isNew=sc=>latest(sc)>(SEEN[sc.id]||0);
function markSeen(sc){const l=latest(sc);if(l>(SEEN[sc.id]||0)){SEEN[sc.id]=l;try{localStorage.setItem('hansei.seen',JSON.stringify(SEEN))}catch(e){}}}

/* ---------- toast / busy ---------- */
let toastT;function toast(m,ms=3200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function busy(on,t='',s=''){$('#busy').hidden=!on;$('#busyT').textContent=t;$('#busyS').textContent=s}

/* ---------- store: this site's API (R2 behind it), or try-out mode in memory when opened as a plain file ---------- */
const API=location.protocol.startsWith('http'),urlCache={},COLS=['videos','scenes','boards'];
function merge(a,b){const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a&&typeof a[k]==='object'&&!Array.isArray(a[k]))?merge(a[k],b[k]):b[k]}return o}
async function api(path,opt){let r;try{r=await fetch(path,{credentials:'same-origin',...(opt||{})})}catch(e){throw{code:'network'}}
  if(r.status===401){authSheet('login');throw{code:'auth'}}
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw{code:j.error||'http',status:r.status}}return r.json()}
const post=(path,body)=>api(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
const store={ver:'',pend:0,pulling:false,started:false,
  async init(){
    if(!API){S.mode='local';S.canUpload=true;COLS.forEach(c=>S.loaded[c]=true);onData();if(!S.who)whoSheet();return}
    let me;try{me=await api('/api/me')}catch(e){COLS.forEach(c=>S.loaded[c]=true);onData();toast('サーバーにつながりません。電波を確認して開き直してください',6000);return}
    if(!me.setup)return authSheet('setup');if(!me.authed)return authSheet('login');await this.start()},
  async start(){S.mode='cloud';S.canUpload=true;await this.pull(true);if(!S.who)whoSheet();if(this.started)return;this.started=true;
    setInterval(()=>{if(!document.hidden)this.pull()},7000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)this.pull()})},
  async pull(first){if(this.pulling)return;this.pulling=true;
    try{const r=await api('/api/state?v='+encodeURIComponent(this.ver));
      if(!r.same&&this.pend===0){this.ver=r.v;COLS.forEach(c=>{S[c]=Object.entries(r[c]||{}).map(([id,d])=>fixNames({...d,id}));S.loaded[c]=true});onData()}
    }catch(e){}finally{this.pulling=false;if(first&&!S.loaded.videos){COLS.forEach(c=>S.loaded[c]=true);onData()}}},
  local(col,id,fn){const i=S[col].findIndex(x=>x.id===id);const next=fn(i>=0?S[col][i]:null);const arr=S[col].slice();
    if(next==null){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]={...next,id};else arr.push({...next,id});S[col]=arr},
  async write(body){if(S.mode!=='cloud')return;this.pend++;try{await post('/api/doc',body)}finally{this.pend--;this.pull()}},
  async set(col,id,data){this.local(col,id,()=>data);await this.write({col,id,op:'set',data})},
  async update(col,id,patch){this.local(col,id,o=>o?merge(o,patch):null);await this.write({col,id,op:'update',data:patch})},
  async del(col,id){this.local(col,id,()=>null);await this.write({col,id,op:'del'})},
  async upload(blob,type){
    if(S.mode==='cloud')return (await api('/api/blob?type='+encodeURIComponent(type),{method:'PUT',body:blob})).id;
    const id='local'+uid();urlCache[id]=URL.createObjectURL(blob);return id},
  async drop(id){try{if(id&&S.mode==='cloud')await api('/api/blob?id='+encodeURIComponent(id),{method:'DELETE'})}catch(e){}},
  url:id=>id?(urlCache[id]||'/media/'+id):''
};
function upErr(e){const c=e&&e.code;
  if(c==='too_large')return 'ファイルが大きすぎます。シーンを短くしてみてください';
  if(c==='unsupported_type')return 'この形式のファイルは保存できませんでした';
  if(c==='auth')return '合言葉をもう一度入れてください';
  return '保存できませんでした。電波のいい場所でもう一度ためしてください'}

/* ---------- family passphrase ---------- */
function authSheet(kind){S.lock=true;const sh=$('#sheet');sh.hidden=false;
  sh.innerHTML=`<div class="sheet-in" role="dialog" aria-label="合言葉"><h2>${kind==='setup'?'家族の合言葉を決めよう':'合言葉を入れてね'}</h2>
   <p class="meta">${kind==='setup'?'この合言葉を知っている人だけが、動画やコメントを見られます。4文字以上で決めて、家族に教えてください。':'家族で決めた合言葉を入れると、このスマホで使えるようになります。'}</p>
   <div class="field"><input id="authPass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="合言葉" aria-label="合言葉"></div>
   <button class="btn primary big" data-act="auth" data-k="${kind}">${kind==='setup'?'この合言葉ではじめる':'はじめる'}</button></div>`}
async function doAuth(kind){const pass=$('#authPass').value.trim();if(pass.length<4){toast('合言葉は4文字以上にしてください');return}
  try{await post(kind==='setup'?'/api/setup':'/api/login',{pass});S.lock=false;$('#sheet').hidden=true;await store.start()}
  catch(e){if(e&&e.code==='already'){toast('合言葉はもう決まっています。入力してください');authSheet('login')}else toast(e&&e.code==='wrong'?'合言葉がちがいます':'つながりませんでした。もう一度ためしてください')}}

/* ---------- game videos: kept in memory while this page is open, uploaded whole to the server ---------- */
const files={mem:{},async put(id,file){this.mem[id]=file;return true},async get(id){return this.mem[id]||null},async del(id){delete this.mem[id]}};
const fsize=b=>b>=1073741824?(b/1073741824).toFixed(1)+'GB':Math.max(1,Math.round((b||0)/1048576))+'MB';
const CHUNK=16*1024*1024,wait=ms=>new Promise(r=>setTimeout(r,ms));
S.uploading=false;S.up={};
const UP={cancel:false,x:null};
function xhrPut(url,blob,onP){return new Promise((res,rej)=>{const x=new XMLHttpRequest();UP.x=x;x.open('PUT',url);x.responseType='json';
  x.upload.onprogress=e=>{if(e.lengthComputable)onP(e.loaded/e.total)};
  x.onload=()=>x.status>=200&&x.status<300&&x.response?res(x.response):rej({code:(x.response&&x.response.error)||'http',status:x.status});
  x.onerror=()=>rej({code:'network'});x.onabort=()=>rej({code:'abort'});x.send(blob)})}
/* wait until the phone is online and this page is in front again before retrying */
const upReady=()=>new Promise(r=>{const t=()=>{if(UP.cancel||(navigator.onLine!==false&&!document.hidden))r();else setTimeout(t,1000)};t()});
async function putRetry(url,blob,onP){for(let t=0;;t++){if(UP.cancel)throw{code:'abort'};
  try{return await xhrPut(url,blob,onP)}catch(e){if(UP.cancel||e.code==='abort')throw{code:'abort'};if(e.status===401||e.status===400||e.status===413||t>=7)throw e;
    upNote('電波を待っています… 自動でやり直します');await wait(2000+1500*t);await upReady();upNote('')}}}
/* sends the whole file, then asks the server how many bytes it holds; resolves with the stored id only when they match */
async function sendFile(file,onP){
  const type=/^video\/(mp4|webm|quicktime)$/.test(file.type)?file.type:'video/mp4';let asset,mp=null;
  try{
    if(file.size<=CHUNK)asset=(await putRetry('/api/blob?type='+encodeURIComponent(type),file,onP)).id;
    else{mp=await api('/api/mp/create?type='+encodeURIComponent(type),{method:'POST'});const n=Math.ceil(file.size/CHUNK),parts=[];
      for(let i=0;i<n;i++){const r=await putRetry(`/api/mp/part?id=${mp.id}&uploadId=${encodeURIComponent(mp.uploadId)}&n=${i+1}`,file.slice(i*CHUNK,(i+1)*CHUNK),p=>onP((i+p)/n));
        parts.push({partNumber:r.n,etag:r.etag})}
      await post('/api/mp/complete',{id:mp.id,uploadId:mp.uploadId,parts});asset=mp.id;mp=null}
    const h=await fetch('/media/'+asset,{method:'HEAD',credentials:'same-origin'});
    if(!h.ok||+h.headers.get('content-length')!==file.size){store.drop(asset);throw{code:'verify'}}
    return asset;
  }catch(e){if(mp)post('/api/mp/abort',{id:mp.id,uploadId:mp.uploadId}).catch(()=>{});throw e}}
function upNote(t){const el=$('#uplNote');if(el)el.textContent=t}
function upScreen(html){const el=$('#upl');el.hidden=false;el.innerHTML=`<div class="upl-in">${html}</div>`}
function upProgress(file,i,n,p){
  if(!$('#uplBar'))upScreen(`<span class="eyebrow">Uploading</span><b class="upl-title">動画をサーバーに保存しています${n>1?`（${i+1} / ${n}本目）`:''}</b>
    <div class="upl-pct num" id="uplPct">0%</div><div class="meter"><i id="uplBar" style="width:0%"></i></div><div class="meta num" id="uplMB"></div>
    <p class="upl-warn">終わるまでこの画面を開いたままにしてください。<br>画面を閉じたり、ほかのアプリに切りかえると止まります。</p><p class="meta" id="uplNote"></p>
    <button class="btn" id="uplCancel">中止する</button>`);
  $('#uplPct').textContent=Math.floor(p*100)+'%';$('#uplBar').style.width=(p*100).toFixed(1)+'%';$('#uplMB').textContent=fsize(file.size*p)+' / '+fsize(file.size);
  $('#uplCancel').onclick=()=>{UP.cancel=true;try{UP.x&&UP.x.abort()}catch(e){}}}
const upAsk=(file,e)=>new Promise(res=>{upScreen(`<span class="eyebrow">Upload failed</span><b class="upl-title">アップロードできませんでした</b>
  <p class="upl-warn">${e&&e.code==='verify'?'サーバーに届いた動画が元の動画と一致しませんでした。':e&&e.code==='auth'?'合言葉の入れ直しが必要です。ページを開き直してください。':'電波が切れたか、途中で画面が閉じられた可能性があります。'}<br>この動画は保存されていません。</p>
  <button class="btn primary big" id="uplAgain">もう一度アップロードする</button><button class="btn" id="uplSkip">やめる</button>`);
  $('#uplAgain').onclick=()=>res(true);$('#uplSkip').onclick=()=>res(false)});
/* list: File[]; forId: an existing video entry that has no stored file yet */
async function uploadFlow(list,forId){
  if(S.uploading)return;S.uploading=true;UP.cancel=false;let wake=null;const done=[];
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
  const player=PLAYERS.includes(S.who)?S.who:(S.filter!=='all'?S.filter:'カンタ'),used=new Set(S.videos.map(v=>v.title));
  for(let i=0;i<list.length&&!UP.cancel;i++){const file=list[i];
    for(;;){$('#upl').innerHTML='';upProgress(file,i,list.length,0);
      try{const asset=await sendFile(file,p=>upProgress(file,i,list.length,p));
        if(forId){await store.update('videos',forId,{asset,size:file.size});files.mem[forId]=file;done.push(forId)}
        else{const id=uid(),d=new Date(file.lastModified||Date.now());let b=(d.getMonth()+1)+'月'+d.getDate()+'日の動画',title=b,n=2;while(used.has(title))title=b+' '+(n++);used.add(title);
          await store.set('videos',id,{title,at:Date.now()+i,by:S.who||'',size:file.size,asset,player});files.mem[id]=file;done.push(id)}
        break;
      }catch(e){if(UP.cancel||(e&&e.code==='abort'))break;if(!await upAsk(file,e))break}}}
  if(wake){try{wake.release()}catch(e){}}
  $('#upl').hidden=true;$('#upl').innerHTML='';S.uploading=false;useAt=0;
  if(UP.cancel)toast('アップロードを中止しました。保存されていない動画は追加されていません',5000);
  else if(done.length)toast(done.length>1?done.length+'本のアップロードが完了しました':'アップロードが完了しました',4000);
  if(done.length===1&&!UP.cancel)go('edit',done[0]);else go('home')}
window.addEventListener('beforeunload',e=>{if(S.uploading){e.preventDefault();e.returnValue=''}});
let useAt=0,useVal=null;
async function fillStorage(){if(!$('#storBody'))return;let h='';
  if(S.mode==='cloud'){if(Date.now()-useAt>30000){try{useVal=await api('/api/usage');useAt=Date.now()}catch(e){}}
    if(useVal)h+=`<div class="meter-row"><b>保存している動画・シーン</b><span class="num">${useVal.files}件・${fsize(useVal.bytes)} / ${fsize(useVal.maxBytes)}</span></div><div class="meter"><i style="width:${clamp(useVal.bytes/useVal.maxBytes*100,1,100).toFixed(1)}%"></i></div>`;
    h+=`<span>試合の動画もシーンもサーバーに保存され、合言葉を入れた家族のスマホから見られます。</span>`}
  else h=`<span>おためしモードでは保存されません。</span>`;
  const el=$('#storBody');if(el)el.innerHTML=h}

/* ---------- drawing (arrows / pen / circle), coordinates stored 0..1 ---------- */
function strokeSVG(s,W,H,sw){
  const X=v=>r3(v*W),Y=v=>r3(v*H),c=esc(s.c||'#ffd43b');
  if(s.t==='pen'&&s.p&&s.p.length)return `<path d="M${s.p.map(p=>X(p[0])+','+Y(p[1])).join('L')}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(s.t==='circle')return `<ellipse cx="${X((s.a[0]+s.b[0])/2)}" cy="${Y((s.a[1]+s.b[1])/2)}" rx="${Math.abs(X(s.b[0])-X(s.a[0]))/2}" ry="${Math.abs(Y(s.b[1])-Y(s.a[1]))/2}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
  if(s.t==='arrow'){const x1=X(s.a[0]),y1=Y(s.a[1]),x2=X(s.b[0]),y2=Y(s.b[1]),L=Math.hypot(x2-x1,y2-y1);if(L<sw)return '';
    const ux=(x2-x1)/L,uy=(y2-y1)/L,hd=Math.min(sw*4.5,L*.6),bx=x2-ux*hd,by=y2-uy*hd,hw=hd*.55;
    return `<line x1="${x1}" y1="${y1}" x2="${r3(bx)}" y2="${r3(by)}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"${s.d?` stroke-dasharray="${sw*2.4} ${sw*2.2}"`:''}/>`+
      `<polygon points="${x2},${y2} ${r3(bx-uy*hw)},${r3(by+ux*hw)} ${r3(bx+uy*hw)},${r3(by-ux*hw)}" fill="${c}"/>`}
  return ''}
const strokesSVG=(list,W,H,sw)=>(list||[]).map(s=>strokeSVG(s,W,H,sw)).join('');
/* A stroke with `at` (seconds into the scene) and `len` (seconds on screen) appears at that moment, draws itself in,
   and fades out. Without them it is always shown. `full` = show it finished (used while the video is paused). */
function animSVG(s,rel,W,H,sw,full){
  const timed=s.at!=null&&s.len>0,u=timed?rel-s.at:0;
  if(timed&&(u<-0.02||u>s.len+0.02))return '';

  const q=r=>host.querySelector(`[data-r="${r}"]`),fr=()=>B.frames[fi];

        `<circle r="${full?68:48}" fill="${k==='o'?'#14213d':'#ffffff'}" stroke="${k==='o'?'#ffffff':'#c92a2a'}" stroke-width="7"/><text y="${full?24:17}" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="${full?70:50}" fill="${k==='o'?'#ffffff':'#c92a2a'}">${k==='o'?p.id[1]:'✕'+p.id[1]}</text>`)+`</g>`}).join('');

    const cur=q('steps').querySelector('[aria-pressed="true"]');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'nearest'})}
  function show(i){fi=clamp(i,0,B.frames.length-1);place(fr().pieces);paint();steps()}
  function stop(){token++;playing=false;q('play').textContent='▶ 再生'}
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const tween=(ms,fn,alive)=>new Promise(res=>{const t0=performance.now();const f=now=>{if(!alive())return res();const t=clamp((now-t0)/ms,0,1);fn(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2);t<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});
  async function play(){if(B.frames.length<2)return;const my=++token;playing=true;q('play').textContent='■ 停止';
    for(let i=0;i<B.frames.length-1;i++){show(i);await wait(500);if(my!==token)return;
      const a=B.frames[i].pieces,b=B.frames[i+1].pieces;
      await tween(950,t=>place(a.map(p=>{const n=b.find(x=>x.id===p.id)||p;return {id:p.id,x:p.x+(n.x-p.x)*t,y:p.y+(n.y-p.y)*t}})),()=>my===token);if(my!==token)return}
    stop();show(B.frames.length-1)}
  q('play').onclick=()=>{if(playing){stop();show(fi)}else play()};
  q('steps').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;stop();
    if(b.dataset.i==='add'){B.frames.splice(fi+1,0,{pieces:clone(fr().pieces),strokes:[]});show(fi+1);if(B.frames.length===2)toast('コマを次の位置に動かそう')}else show(+b.dataset.i)});
  if(edit){
    const seg=(r,attr,fn)=>[...q(r).children].forEach(b=>b.onclick=()=>{[...q(r).children].forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[attr])});
    seg('tool','t',t=>{tool=t;const v=q('wrap').firstChild;if(v)v.classList.toggle('draw',t!=='move')});seg('col','c',c=>{color=c});
    seg('court','k',k=>{if(k===B.court)return;stop();B.frames.forEach(f=>{f.pieces.forEach(p=>{p.y=r3(k==='full'?p.y/2:Math.min(.98,p.y*2))});f.strokes=[]});B.court=k;court();steps();if(k==='full')q('tool').scrollIntoView({block:'start'})});
    q('undo').onclick=()=>{fr().strokes.pop();paint()};q('clear').onclick=()=>{fr().strokes=[];paint()};
    q('reset').onclick=()=>{stop();fr().pieces=startPieces();if(B.court==='full')fr().pieces.forEach(p=>p.y=r3(p.y/2));fr().strokes=[];court()};
    q('delstep').onclick=()=>{if(B.frames.length<2)return;stop();B.frames.splice(fi,1);show(Math.min(fi,B.frames.length-1))}}
  court();steps();
  return {destroy:()=>{token++;playing=false}}}

let B=null,boardList=null;
function viewBoard(){
  if(!B)B=newBoard();
  app.innerHTML=`<div class="boards" id="bdList"></div><div class="colA"><div class="stack" id="bdHost"></div></div>
   <div class="colB"><div class="panel"><div class="field"><label class="label" for="bdTitle">作戦の名前</label><input id="bdTitle" maxlength="40" placeholder="例：ゾーンの崩し方" value="${esc(B.title)}"></div>
     <div class="field"><label class="label" for="bdMemo">メモ</label><textarea id="bdMemo" maxlength="600" placeholder="ポイントや合図を書いておこう">${esc(B.memo)}</textarea></div>
     <div class="row"><button class="btn primary grow" id="bdSave">作戦を保存</button><button class="btn danger" id="bdDel" ${B.id?'':'hidden'}>削除</button></div></div></div>`;
  const ui=boardUI($('#bdHost'),B,{edit:true});cleanup=ui.destroy;
  $('#bdSave').onclick=async()=>{B.title=$('#bdTitle').value.trim()||'作戦 '+day(Date.now());B.memo=$('#bdMemo').value.trim();if(!B.id)B.id=uid();
    try{await store.set('boards',B.id,{title:B.title,memo:B.memo,court:B.court,frames:clone(B.frames),by:S.who||'',at:Date.now()});toast('作戦を保存しました');$('#bdTitle').value=B.title;$('#bdDel').hidden=false;boardList()}
    catch(e){toast('保存できませんでした',4000)}};
  let armed=false;$('#bdDel').onclick=async()=>{const d=$('#bdDel');if(!armed){armed=true;d.classList.add('armed');d.textContent='もう一度押すと削除';setTimeout(()=>{armed=false;d.classList.remove('armed');d.textContent='削除'},3000);return}
    try{await store.del('boards',B.id);B=null;toast('削除しました');go('board')}catch(e){toast('削除できませんでした')}};
  boardList=()=>{const el=$('#bdList');if(!el)return;const bs=S.boards.slice().sort((a,b)=>b.at-a.at);
    el.innerHTML=`<button class="btn small" data-act="newboard">＋ 新しい作戦板</button>`+bs.map(b=>`<button class="btn small" data-act="openboard" data-id="${esc(b.id)}" aria-pressed="${B&&B.id===b.id}"><span>${esc(b.title)}</span><em>${b.court==='full'?'オール':'ハーフ'}${(b.frames||[]).length>1?'・'+b.frames.length+'コマ':''}</em></button>`).join('')};
  boardList();
}
/* the board that belongs to one play (scene) */
function viewSBoard(id){
  const sc=S.scenes.find(x=>x.id===id);if(!sc){go('home');return}
  const b=normBoard(sc.board),ar=sc.ar||16/9,H=Math.round(1000/ar),gv=S.videos.find(x=>x.id===sc.videoId),src=sc.asset||(sc.whole&&gv&&gv.asset)||'',url=src?store.url(src):'',photo=sc.kind==='photo';
  let sp=sc.speed||1;
  app.innerHTML=`<div class="span"><span class="eyebrow">Play board</span><h2 style="font-size:19px;font-weight:900;line-height:1.35;overflow-wrap:anywhere">${esc(sc.title)}</h2><p class="meta">動画を見ながら、このプレーのコマの動きを記録します</p></div>
   <div class="colA"><div class="stack" id="bdHost"></div></div>
   <div class="colB stick"><span class="label">このプレーの動画</span>
     <div class="stage-wrap"><div class="stage" style="aspect-ratio:${ar};width:min(100%, calc(46vh * ${ar}))">
       ${photo?`<img src="${esc(url)}" alt="${esc(sc.title)}">`:`<video id="sbV" playsinline webkit-playsinline muted loop preload="auto" poster="${esc(store.url(sc.poster))}"></video><button class="tap" id="sbTap" aria-label="再生・一時停止"></button>`}
       <svg class="ov" viewBox="0 0 1000 ${H}" preserveAspectRatio="none"><g id="sbOv"></g></svg></div></div>
     ${photo?'':`<div class="row"><button class="btn play grow" id="sbPlay" aria-label="再生">▶</button><button class="btn" id="sbTop">最初から</button></div>
     <div class="seg full" id="sbSpeed">${[.25,.5,1].map(x=>`<button data-s="${x}" aria-pressed="${x===sp}">${x===1?'ふつう':x+'倍スロー'}</button>`).join('')}</div>`}
     <div class="row"><button class="btn primary grow" id="sbSave">このプレーに保存</button>${sc.board?'<button class="btn danger" id="sbDel">作戦板を外す</button>':''}</div></div>`;
  const ui=boardUI($('#bdHost'),b,{edit:true}),V=$('#sbV');let raf=0;
  const lines=()=>{const rel=V?V.currentTime-(sc.start||0):0;$('#sbOv').innerHTML=(sc.strokes||[]).map(x=>animSVG(x,rel,1000,H,7,!V||V.paused)).join('')};lines();
  if(V){const a=sc.start||0,e=sc.end||0;if(url)V.src=url;V.playbackRate=sp;
    const st=()=>{const pl=$('#sbPlay');if(pl)pl.textContent=V.paused?'▶':'❙❙'};
    V.addEventListener('loadedmetadata',()=>{if(a>0)V.currentTime=a});
    V.addEventListener('timeupdate',()=>{if(sc.whole&&(V.currentTime>=e||V.currentTime<a-.3))V.currentTime=a});
    ['play','pause'].forEach(n=>V.addEventListener(n,st));
    const tg=()=>V.paused?V.play().catch(()=>{}):V.pause();$('#sbPlay').onclick=tg;$('#sbTap').onclick=tg;
    $('#sbTop').onclick=()=>{V.currentTime=a;V.play().catch(()=>{})};
    $$('#sbSpeed button').forEach(x=>x.onclick=()=>{$$('#sbSpeed button').forEach(y=>y.setAttribute('aria-pressed',y===x));sp=+x.dataset.s;V.playbackRate=sp});
    const tick=()=>{lines();raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
  cleanup=()=>{ui.destroy();cancelAnimationFrame(raf);if(V){V.pause();V.removeAttribute('src');V.load()}};
  $('#sbSave').onclick=async()=>{try{await store.update('scenes',id,{board:{court:b.court,frames:clone(b.frames),by:S.who||'',at:Date.now()}});toast('作戦板を保存しました');go('scene',id)}catch(e){toast('保存できませんでした',4000)}};
  const d=$('#sbDel');if(d)d.onclick=async()=>{if(!twoTap(d,'もう一度押すと外します'))return;try{await store.update('scenes',id,{board:null});go('scene',id)}catch(e){toast('外せませんでした')}};
}

/* ---------- actions ---------- */
let armT=null;
function twoTap(btn,label){if(btn.classList.contains('armed'))return true;btn.classList.add('armed');const old=btn.textContent;btn.textContent=label;clearTimeout(armT);armT=setTimeout(()=>{btn.classList.remove('armed');btn.textContent=old},3000);return false}
const ACT={
  tab:d=>go(d.v),back:()=>S.view==='sboard'?go('scene',S.arg):go('home'),sboard:d=>go('sboard',d.id),who:whoSheet,closesheet:()=>{if(!S.lock)$('#sheet').hidden=true},
  setwho:d=>setWho(d.n),'setwho-other':()=>setWho($('#whoOther').value),
  addvideo:()=>pickVideo(null),reattach:d=>pickVideo(d.id),edit:d=>go('edit',d.id),scene:d=>go('scene',d.id),
  videomenu:d=>videoMenu(d.id),
  theme:()=>{const r=document.documentElement,light=r.getAttribute('data-theme')!=='light';if(light)r.setAttribute('data-theme','light');else r.removeAttribute('data-theme');
    try{localStorage.setItem('hansei.theme',light?'light':'dark')}catch(e){}const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=light?'#f3f4f7':'#000000';top();toast(light?'ライトモードにしました':'ダークモードにしました',1600)},
  ratefilter:d=>{S.rate=d.m;viewHome()},
  auth:d=>doAuth(d.k),
  filter:d=>{S.filter=d.f;try{localStorage.setItem('hansei.filter',d.f)}catch(e){}viewHome()},
  pickplayer:(d,b)=>{$$('#vPlayer button').forEach(x=>x.setAttribute('aria-pressed',x===b))},
  renamevideo:async d=>{const t=$('#vTitle').value.trim();if(!t)return;try{const pl=$('#vPlayer [aria-pressed="true"]');await store.update('videos',d.id,{title:t,...(pl?{player:pl.dataset.n}:{})});$('#sheet').hidden=true;if(S.view==='home')viewHome()}catch(e){toast('保存できませんでした')}},
  delvideo:(d,b)=>{if(twoTap(b,'もう一度押すと削除（元にもどせません）'))delVideo(d.id)},
  editscene:d=>editSceneSheet(d.id),
  savescene:async d=>{const t=$('#esTitle').value.trim();if(!t)return;try{await store.update('scenes',d.id,{title:t,note:$('#esNote').value.trim()});$('#sheet').hidden=true;go('scene',d.id)}catch(e){toast('保存できませんでした')}},
  delscene:async(d,b)=>{if(!twoTap(b,'もう一度押すと削除（元にもどせません）'))return;const sc=S.scenes.find(x=>x.id===d.id);$('#sheet').hidden=true;
    try{await store.del('scenes',d.id);if(sc){if(!sc.whole)await store.drop(sc.asset);if(sc.poster!==sc.asset)await store.drop(sc.poster)}toast('削除しました')}catch(e){toast('削除できませんでした')}go('home')},
  delcomment:async d=>{try{await store.update('scenes',d.id,{comments:{[d.c]:{x:true}}})}catch(e){toast('消せませんでした')}sceneRefresh&&sceneRefresh()},
  newboard:()=>{B=newBoard();go('board')},
  openboard:d=>{const b=S.boards.find(x=>x.id===d.id);if(!b)return;B=normBoard(b);go('board')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&S.who&&!S.lock)$('#sheet').hidden=true});

top();viewHome();store.init();
})();
</script>
